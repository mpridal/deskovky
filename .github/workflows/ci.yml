name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # check_scope compares a game branch with origin/main.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: A game branch changes only its own game (spec 13.2)
        if: startsWith(github.head_ref || github.ref_name, 'game/')
        run: dart run tool/check_scope.dart "${{ github.head_ref || github.ref_name }}"
      - run: flutter analyze --fatal-infos
      # A stuck test fails after 90 s instead of hanging the whole run.
      - run: flutter test --timeout 90s
