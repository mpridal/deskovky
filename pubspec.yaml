name: deskovky
description: "Rodinná kolekce deskových her pro Android."
publish_to: 'none'
version: 0.4.0+400

environment:
  sdk: ^3.13.7

dependencies:
  characters: ^1.4.1
  crypto: ^3.0.7
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  http: ^1.6.0
  intl: any
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/audio/CREDITS.json
    - assets/games/tictactoe/
    - assets/games/tictactoe/sfx/
    - assets/games/memory/
    - assets/games/memory/sfx/
    - assets/games/minesweeper/
    - assets/games/minesweeper/sfx/
    - assets/games/ludo/
    - assets/games/ludo/sfx/
    - assets/games/checkers/
    - assets/games/checkers/sfx/
    - assets/games/memory/cards/animals/
    - assets/games/memory/cards/food/
    - assets/games/memory/cards/transport/
    - assets/games/memory/cards/space/
    - assets/config/rewards.json
    - assets/config/shop_items.json
    - assets/fonts/OFL-Baloo2.txt
    - assets/fonts/OFL-Nunito.txt
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
